name: Android CI Build Final 100%

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Khởi tạo Root Project và Tối ưu RAM (Fix lỗi Worker)
      run: |
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "lecongtool"
        include(":app")
        EOF
        
        cat << 'EOF' > build.gradle.kts
        plugins { id("com.android.application") version "8.1.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }
        EOF
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
        org.gradle.daemon=false
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Dọn dẹp cache và Build APK (Chống tràn RAM)
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug --stacktrace --no-daemon -x lint

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lecongtool-APK-Perfect
        path: app/build/outputs/apk/debug/app-debug.apk
