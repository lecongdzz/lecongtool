name: Android CI Build Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Tự động khởi tạo file Gradle Root dự phòng
      run: |
        echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
        echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
        echo 'rootProject.name = "lecongtool"' >> settings.gradle.kts
        echo 'include(":app")' >> settings.gradle.kts
        echo 'plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }' > build.gradle.kts
        echo 'android.useAndroidX=true' > gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
        cache-disabled: true

    - name: Cấp quyền và Build APK (Tự động ký chứng chỉ Debug tiêu chuẩn)
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug --stacktrace

    - name: Upload Build Artifact (APK Hoàn Chỉnh)
      uses: actions/upload-artifact@v4
      with:
        name: lecongtool-Final-APK
        path: app/build/outputs/apk/debug/app-debug.apk
