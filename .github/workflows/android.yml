name: Android CI Build VIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Khởi tạo cấu hình Gradle gốc
      run: |
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "lecongtool"
        include(":app")
        EOF
        
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF
        
        echo "" >> app/build.gradle.kts
        echo "android { lint { abortOnError = false; checkReleaseBuilds = false } }" >> app/build.gradle.kts

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
        cache-disabled: true

    - name: Cấp quyền và Build APK Bản Thương Mại (Release)
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew clean assembleRelease --stacktrace

    - name: Tạo Chứng Chỉ và Ký APK Tự Động (Bypass Lỗi Gói Không Hợp Lệ)
      run: |
        # 1. Tạo Keystore Production
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias lecong -storepass password123 -keypass password123 -dname "CN=LeCong, OU=VIP, O=TTBoost, L=HCM, S=HCM, C=VN"
        
        # 2. Tìm thư mục build-tools mới nhất
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        
        # 3. Căn chỉnh Zip (Zipalign) - Bắt buộc cho Android 11+
        $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
        
        # 4. Ký file APK bằng chuẩn V1, V2, V3
        $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-key-alias lecong --ks-pass pass:password123 --key-pass pass:password123 --out app-release-signed.apk app-aligned.apk

    - name: Upload Build Artifact (APK Hoàn Chỉnh)
      uses: actions/upload-artifact@v4
      with:
        name: lecongtool-VIP-Signed-APK
        path: app-release-signed.apk
