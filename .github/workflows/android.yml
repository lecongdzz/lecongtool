name: Android CI Build 100% Success

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize Root Gradle Configs
      run: |
        echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
        echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
        echo 'rootProject.name = "lecongtool"' >> settings.gradle.kts
        echo 'include(":app")' >> settings.gradle.kts
        echo 'plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }' > build.gradle.kts
        echo 'android.useAndroidX=true' > gradle.properties
        echo 'android.nonTransitiveRClass=true' >> gradle.properties
        echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Build APK
      run: gradle clean assembleDebug --stacktrace -x lint

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lecongtool-APK-Perfect
        path: app/build/outputs/apk/debug/
